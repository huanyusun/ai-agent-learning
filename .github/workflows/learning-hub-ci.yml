# 学习中心 CI:只做离线校验、离线测试与生成漂移检查。
# 不访问公网、不依赖产品模型配置(FDE_MODEL_* 不是必需项)。
name: learning-hub-ci

on:
  push:
    paths:
      - "learning/**"
      - "tools/learning_hub/**"
      - "tests/learning_hub/**"
      - ".github/workflows/learning-hub-*.yml"
  pull_request:
    paths:
      - "learning/**"
      - "tools/learning_hub/**"
      - "tests/learning_hub/**"
      - ".github/workflows/learning-hub-*.yml"

permissions:
  contents: read

concurrency:
  group: learning-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Validate catalog
        run: python3 -m tools.learning_hub validate
      - name: Offline tests (no network)
        run: python3 -m pytest tests/learning_hub -q
      - name: Build drift check
        run: python3 -m tools.learning_hub build --check
