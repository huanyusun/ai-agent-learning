# learning.f2b.me 实际生效配置(2026-10-29 部署并外部验证通过)
#
# 服务器拓扑(154.29.144.91):
#   公网 443 由 /etc/nginx/nginx.conf 的 stream 层按 SNI 分发
#   (map $ssl_preread_server_name;learning.f2b.me 已登记为 nginx_web);
#   各站点 vhost 统一监听 127.0.0.1:10444 ssl,由 SNI 选中各自证书。
# 证书:Let's Encrypt,webroot=/var/www/learning,经 80 端口自动续期。
# 上游:https://huanyusun.github.io/ai-agent-learning/(Pages 工作流自动发布)。

server {
    listen 80;
    listen [::]:80;
    server_name learning.f2b.me;

    location /.well-known/acme-challenge/ {
        root /var/www/learning;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:10444 ssl;
    server_name learning.f2b.me;

    ssl_certificate     /etc/letsencrypt/live/learning.f2b.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learning.f2b.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://huanyusun.github.io/ai-agent-learning/;
        proxy_set_header Host huanyusun.github.io;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        # 把上游 Location 里的 github.io 绝对路径改写回本域名,避免跳回 github.io
        proxy_redirect https://huanyusun.github.io/ai-agent-learning/ /;
        expires 10m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

# 另需在 /etc/nginx/nginx.conf 的 stream map 中登记(已生效):
