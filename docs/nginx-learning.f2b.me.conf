# 学习中心自有域名代理加速:learning.f2b.me → GitHub Pages
#
# DNS 已就绪:learning.f2b.me → 154.29.144.91(本服务器,通配解析)
# 上游站点:https://huanyusun.github.io/ai-agent-learning/
#
# 上线步骤(服务器上执行):
#   1) 放置本文件:/etc/nginx/conf.d/learning.f2b.me.conf
#      先注释掉下方 443 server 里的三行 ssl_* 配置(证书还没签),nginx -t && reload
#   2) 签证书:certbot certonly --nginx -d learning.f2b.me
#      证书会落在 /etc/letsencrypt/live/learning.f2b.me/
#   3) 恢复三行 ssl_* 配置,nginx -t && nginx -s reload
#   4) 验证:curl -sSI https://learning.f2b.me/   (应返回 200,Content-Type: text/html)

server {
    listen 80;
    server_name learning.f2b.me;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name learning.f2b.me;

    ssl_certificate     /etc/letsencrypt/live/learning.f2b.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learning.f2b.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 域名根路径 → Pages 的 /ai-agent-learning/ 子路径
    location / {
        proxy_pass https://huanyusun.github.io/ai-agent-learning/;
        proxy_set_header Host huanyusun.github.io;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;

        # 把上游 Location 里的 github.io 绝对路径改写回本域名,避免跳回 github.io
        proxy_redirect https://huanyusun.github.io/ai-agent-learning/ /;

        expires 10m;                       # Pages 内容不可变,浏览器缓存 10 分钟
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
