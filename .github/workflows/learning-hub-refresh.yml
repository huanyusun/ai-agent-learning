# 学习中心定时更新:每周 refresh,每月首次(或手动强制/来源失败重试)额外 discover。
# 结果提交到固定分支 automation/learning-hub-refresh 并维护一个 PR;不合并、不推送默认分支。
# 注意:PR 改动不会触发 learning-hub-ci,因此本工作流内部显式运行全套离线验证。
name: learning-hub-refresh

on:
  schedule:
    - cron: "17 1 * * 1" # UTC 周一 01:17 = 北京时间周一 09:17;schedule 可能延迟
  workflow_dispatch:
    inputs:
      discover:
        description: "本次同时执行候选课程发现(忽略月度判断)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: learning-hub-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest==9.1.1
      - name: Validate before refresh
        run: |
          python3 -m tools.learning_hub validate
          python3 -m pytest tests/learning_hub -q

      - name: Decide monthly discovery
        id: discovery
        env:
          FORCE_DISCOVER: ${{ inputs.discover }}
        run: |
          CURRENT_MONTH="$(date -u +%Y-%m)"
          LAST_MONTH="$(python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("learning/data/candidates.json")
          if not path.exists():
              print("")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              print(data.get("last_discovery_month") or "")
          PY
          )"
          echo "当前月 $CURRENT_MONTH / 上次发现月 ${LAST_MONTH:-无} / 手动强制 $FORCE_DISCOVER"
          # last_discovery_month 只在全部启用来源成功后推进;来源失败会保留旧月份,自然获得重试资格
          if [ "$FORCE_DISCOVER" = "true" ] || [ -z "$LAST_MONTH" ] || [ "$LAST_MONTH" != "$CURRENT_MONTH" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh course observations
        run: python3 -m tools.learning_hub refresh --apply

      - name: Discover candidates (monthly / forced / retry)
        if: steps.discovery.outputs.due == 'true'
        run: python3 -m tools.learning_hub discover --apply

      - name: Verify learning module after updates
        run: |
          python3 -m tools.learning_hub validate
          python3 -m pytest tests/learning_hub -q
          python3 -m tools.learning_hub build --check

      - name: Commit updates to automation branch
        id: commit
        env:
          HEAD_BRANCH: automation/learning-hub-refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
          git checkout -B "$HEAD_BRANCH"
          # 提交 allowlist:只允许自动数据与生成文件;不含 .env、.runtime、客户材料
          ALLOWLIST=(
            "learning/data/observations.json"
            "learning/data/candidates.json"
            "learning/updates/latest.md"
            "learning/index.html"
            "learning/README.md"
            "learning/courses.md"
            "learning/weekly-plan.md"
          )
          if [ -z "$(git status --porcelain -- "${ALLOWLIST[@]}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无文件差异,不建 PR。"
          else
            git add "${ALLOWLIST[@]}"
            git commit -m "chore(learning-hub): 自动更新课程观测与生成文件 $(date -u '+%Y-%m-%d')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push automation branch (with lease)
        if: steps.commit.outputs.changed == 'true'
        env:
          HEAD_BRANCH: automation/learning-hub-refresh
          REMOTE_SHA: ${{ steps.commit.outputs.remote_sha }}
        run: |
          # 带租约更新:仅当远端分支仍是上次记录的 SHA 时才覆盖;他人新建或移动过该分支则失败保留现场
          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/$HEAD_BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$HEAD_BRANCH"
          else
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi

      - name: Create or update single PR
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: automation/learning-hub-refresh
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          PR_JSON="$(gh pr list --head "$HEAD_BRANCH" --state open --json number,author --jq '.[0]' 2>&1)" || {
            echo "gh pr list 失败(常见原因:仓库策略限制 Actions 权限):$PR_JSON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          NUMBER="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["number"] if data else "")')"
          if [ -n "$NUMBER" ]; then
            AUTHOR="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["author"]["login"])')"
            if [ "$AUTHOR" != "github-actions[bot]" ]; then
              echo "分支/PR 归属不符:automation/learning-hub-refresh 的开放 PR 由 $AUTHOR 创建,不覆盖;报告与数据保留在 artifact。" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            gh pr edit "$NUMBER" --base "$DEFAULT_BRANCH" --body-file learning/updates/latest.md
            echo "已更新现有 PR #$NUMBER"
          else
            gh pr create --head "$HEAD_BRANCH" --base "$DEFAULT_BRANCH" \
              --title "learning-hub: 自动课程更新 $(date -u '+%Y-%m-%d')" \
              --body-file learning/updates/latest.md
            echo "已创建新 PR"
          fi

      - name: Write job summary
        if: always()
        run: cp learning/updates/latest.md "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(报告文件缺失)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and data artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learning-hub-update
          retention-days: 30
          if-no-files-found: warn
          path: |
            learning/data/observations.json
            learning/data/candidates.json
            learning/updates/latest.md

      - name: Report failure reason
        if: failure()
        run: echo "学习中心自动更新失败;原因见上方日志(如 PR 权限被仓库策略拒绝),报告与自动数据已作为 artifact 保留,不会静默丢失。" | tee -a "$GITHUB_STEP_SUMMARY"
